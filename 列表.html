<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 共享样式:变量 → 基础 → 加载动画 → 导航 → 页脚 → 区块标题 → 图片放大 -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/加载动画.css">
    <link rel="stylesheet" href="./css/navigation.css">
    <link rel="stylesheet" href="./css/页脚.css">
    <link rel="stylesheet" href="./css/section-header.css">
    <link rel="stylesheet" href="./css/image-zoom.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精选作品 - 倾城的个人网站</title>
    <style>
        /* ==================== 列表页专属样式 ==================== */

        /* 作品网格 */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
            will-change: transform;
        }

        .work-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            will-change: transform;
            transform: translateZ(0);
            contain: layout style paint;
            display: flex;
            flex-direction: column;
        }

        .work-card:hover {
            transform: translateY(-5px) translateZ(0);
            box-shadow: var(--shadow-hover);
        }

        /* 图片完整显示 */
        .work-image {
            width: 100%;
            object-fit: contain;
            background: var(--gray-100);
            padding: 10px;
            transition: var(--transition);
            will-change: transform;
        }

        .work-card:hover .work-image {
            transform: scale(1.05);
        }

        .work-info {
            padding: 20px;
            will-change: transform;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .work-title {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .work-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-light);
        }

        .work-location {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 分类筛选 */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-tag {
            padding: 10px 20px;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 25px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            will-change: transform;
            transform: translateZ(0);
        }

        .filter-tag.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        .filter-tag:hover:not(.active) {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* 图片预览模态框样式已抽离到 css/image-zoom.css */

        .modal-info {
            position: absolute;
            bottom: -60px;
            left: 0;
            right: 0;
            text-align: center;
            color: var(--white);
        }

        /* 导航栏固定定位优化 */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            will-change: transform;
            transform: translateZ(0);
            backdrop-filter: none;
        }

        /* 移动端适配 - 【关键修改】每行一张照片 */
        @media (max-width: 768px) {
            .works-grid {
                /* 【关键修改】改为单列布局 */
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .work-image {
                /* 【关键修改】移动端调整图片高度 */
                min-height: 200px;
                max-height: 300px;
            }
        }

        @media (max-width: 480px) {
            .works-grid {
                gap: 15px;
            }
            
            .work-image {
                min-height: 180px;
                max-height: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- 加载动画 -->
    <div class="loading-container">
        <div class="loading-spinner"></div>
    </div>

    <!-- 导航栏 -->
    <header class="header">
        <div class="container">
            <h1 class="logo">倾城的个人博客</h1>
            <button class="menu-toggle" aria-label="打开菜单">☰</button>
            <nav class="nav">
                <a class="nav-item" href="./首页.html">首页</a>
                <a class="nav-item nav-active" href="#">精选作品</a>
                <a class="nav-item" href="./作品集.html">作品集</a>
                <a class="nav-item" href="./约拍.html">约拍须知</a>
                <a class="nav-item" href="./个人中心.html">个人中心</a>
            </nav>
            <div class="header-right">
                <a href="./登录.html" class="btn-login">登录</a>
                <a href="./注册.html" class="btn-reg">注册</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="section-header">
                <h1 class="section-title">精选作品</h1>
                <p class="section-subtitle">「我的镜头里，藏着这些故事」</p>
            </div>

            <!-- 分类筛选 -->
            <div class="filter-bar">
                <div class="filter-tag active" data-category="all">全部</div>
                <div class="filter-tag" data-category="city">城市风光</div>
                <div class="filter-tag" data-category="nature">猫猫</div>
                <div class="filter-tag" data-category="street">街头纪实</div>
            </div>

            <!-- 作品网格 -->
            <div class="works-grid" id="worksGrid">
                <!-- 作品将通过JS动态加载 -->
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <h3>倾城的个人网站</h3>
            <p class="footer-desc">用镜头捕捉生活中的美好瞬间，记录时光的痕迹</p>
            <div class="divider"></div>
            <p class="copyright">© 2025 倾城的个人网站 | 自由摄影师作品展示</p>
            <p class="copyright">联系方式：2196353107@qq.com | 约拍请私信</p>
        </div>
    </footer>

    <!-- 图片预览模态框 -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">×</button>
            <img src="" alt="" class="modal-img" id="modalImg">
            <div class="modal-info" id="modalInfo"></div>
        </div>
    </div>

    <!-- 回到顶部 -->
    <button class="back-to-top">↑</button>

    <script>
        // 作品数据
        const worksData = [
            { src: './src/IMG_20240404_203935.jpg', title: '奉节职教', location: '2022・奉节职教', category: 'city' },
            { src: './src/IMG_20240403_210820.jpg', title: '校园时光', location: '2022・奉节职教', category: 'city' },
            { src: './src/CRall_20230917_100431043.jpg', title: '广达厂区', location: '2023・重庆广达', category: 'city' },
            { src: './src/IMG20251125173404.jpg', title: '建工记忆', location: '2025・重庆建工', category: 'street' },
            { src: './src/IMG20250319181807.jpg', title: '东莞印象', location: '2025・广东东莞', category: 'city' },
            { src: './src/IMG20240212182948.jpg', title: '奉节街拍', location: '2024・重庆奉节', category: 'street' },
            { src: './src/IMG20250205215132.jpg', title: '猫咪日常', location: '2023・猫', category: 'nature' },
            { src: './src/IMG_20240204_144317.jpg', title: '喵星人', location: '2023・猫', category: 'nature' },
            { src: './src/IMG_20240211_144249.jpg', title: '慵懒午后', location: '2023・猫', category: 'nature' },
            { src: './src/CRall_20230929_125636266.jpg', title: '山城夜色', location: '2022・重庆夜景', category: 'city' },
            { src: './src/CRall_20230929_130850624.jpg', title: '重庆夜景', location: '2022・重庆夜景', category: 'city' },
            { src: './src/CRall_20230929_135926367.jpg', title: '夜景', location: '2022・重庆夜景', category: 'city' }
        ];

        // ==================== 【优化】防抖函数 ====================
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            // 【优化】减少加载动画等待时间
            setTimeout(() => document.body.classList.add('loaded'), 200);
            
            initMobileMenu();
            initBackToTop();
            initFilter();
            renderWorks('all');
        });

        function initMobileMenu() {
            const toggle = document.querySelector('.menu-toggle');
            const nav = document.querySelector('.nav');
            
            toggle.addEventListener('click', () => {
                nav.classList.toggle('active');
                toggle.textContent = nav.classList.contains('active') ? '✕' : '☰';
            });

            // 【优化】点击菜单项后自动关闭菜单
            nav.addEventListener('click', (e) => {
                if (e.target.classList.contains('nav-item')) {
                    nav.classList.remove('active');
                    toggle.textContent = '☰';
                }
            });
        }

        // ==================== 【优化】防抖处理滚动事件 ====================
        function initBackToTop() {
            const btn = document.querySelector('.back-to-top') || createBackToTopBtn();
            
            // 使用防抖函数，减少滚动事件触发频率
            const handleScroll = debounce(() => {
                btn.classList.toggle('visible', window.scrollY > 300);
            }, 100); // 100ms延迟，平衡性能和体验
            
            // 【优化】passive: true 提升滚动性能
            window.addEventListener('scroll', handleScroll, { passive: true });
            
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function createBackToTopBtn() {
            const btn = document.createElement('button');
            btn.className = 'back-to-top';
            btn.innerHTML = '↑';
            btn.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 44px;
                height: 44px;
                border-radius: 50%;
                background: var(--primary);
                color: white;
                border: none;
                cursor: pointer;
                opacity: 0;
                transition: opacity 0.3s;
                z-index: 1000;
                font-size: 18px;
                /* 【优化】硬件加速 */
                will-change: transform;
                transform: translateZ(0);
                /* 【优化】移除点击高亮 */
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            `;
            document.body.appendChild(btn);
            return btn;
        }

        function renderWorks(category) {
            const grid = document.getElementById('worksGrid');
            grid.innerHTML = '';
            
            const filteredWorks = category === 'all' 
                ? worksData 
                : worksData.filter(work => work.category === category);
            
            // 【优化】使用DocumentFragment减少DOM重绘
            const fragment = document.createDocumentFragment();
            
            filteredWorks.forEach(work => {
                const card = document.createElement('div');
                card.className = 'work-card';
                card.innerHTML = `
                    <!-- 【优化】图片懒加载 -->
                    <img src="${work.src}" alt="${work.title}" class="work-image" loading="lazy">
                    <div class="work-info">
                        <h3 class="work-title">${work.title}</h3>
                        <div class="work-meta">
                            <span class="work-location">📍 ${work.location}</span>
                            <span class="work-category">${getCategoryName(work.category)}</span>
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => {
                    // 填充信息(标题/地点),再用共享模块打开模态框
                    const info = document.getElementById('modalInfo');
                    if (info) info.innerHTML = `<h3>${work.title}</h3><p>${work.location}</p>`;
                    if (window.imageZoom) window.imageZoom.open(work.src);
                });
                fragment.appendChild(card);
            });
            
            // 【优化】一次性添加到DOM
            grid.appendChild(fragment);
        }

        function getCategoryName(category) {
            const names = {
                city: '城市风光',
                portrait: '人像约拍',
                nature: '自然风光',
                street: '街头纪实'
            };
            return names[category] || '其他';
        }

        function initFilter() {
            const tags = document.querySelectorAll('.filter-tag');
            tags.forEach(tag => {
                tag.addEventListener('click', () => {
                    tags.forEach(t => t.classList.remove('active'));
                    tag.classList.add('active');
                    renderWorks(tag.dataset.category);
                });
            });
        }

        // 图片预览(滚轮缩放 + 双指捏合 + 拖动平移)由 JS/image-zoom.js 提供

        // ==================== 【优化】防止滚动穿透 ====================
        document.addEventListener('touchmove', function(e) {
            // 如果菜单打开，阻止背景滚动
            const nav = document.querySelector('.nav');
            if (nav.classList.contains('active')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>

    <!-- 共享图片放大预览模块 -->
    <script src="./JS/image-zoom.js"></script>
</body>
</html>
