<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 倾城的个人网站</title>
    <!-- 共享样式:变量 → 基础 → 加载动画 → 表单 -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/加载动画.css">
    <link rel="stylesheet" href="./css/form.css">
    <style>
        /* ==================== 登录页专属样式 ==================== */

        /* body 居中(共享 base.css 默认非居中) */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 登录页专属:测试账号提示框 */
        .demo-credentials {
            background: rgba(74, 144, 226, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-light);
        }

        .demo-credentials h5 {
            margin-bottom: 5px;
            color: var(--text-dark);
        }
    </style>
</head>
<body>
    <!-- 加载动画 -->
    <div class="loading-container">
        <div class="loading-spinner"></div>
    </div>

    <div class="login-card">
        <div class="login-header">
            <h1>用户登录</h1>
        </div>
        <div class="login-body">
            <form id="loginForm" method="post">
                <div class="form-group">
                    <label for="username">账号</label>
                    <input type="text" id="username" placeholder="请输入账号" required>
                    <div class="error-message" id="usernameError">请输入正确的账号格式</div>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                    <div class="error-message" id="passwordError">密码格式不正确</div>
                </div>
                <button type="submit" class="btn-primary">登录</button>
            </form>
            <div class="demo-credentials">
                <h5>测试账号</h5>
                <p>账号：qc2196<br>密码：123456</p>
            </div>
            <div class="form-footer">
                <p>还没有账号？<a href="注册.html">立即注册</a></p>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => document.body.classList.add('loaded'), 300);
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');
            
            // 重置错误信息
            usernameError.style.display = 'none';
            passwordError.style.display = 'none';
            
            // 验证规则
            const usernameRegex = /^[a-z0-9]{3,16}$/;
            const passwordRegex = /^[a-zA-Z0-9]{3,16}$/;
            
            let isValid = true;
            
            if (!usernameRegex.test(username)) {
                usernameError.style.display = 'block';
                isValid = false;
            }
            
            if (!passwordRegex.test(password)) {
                passwordError.style.display = 'block';
                isValid = false;
            }
            
            if (!isValid) return;
            
            // 登录验证
            if (username === 'qc2196' && password === '123456') {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', username);
                alert('登录成功！');
                window.location.href = '首页.html';
            } else {
                alert('账号或密码错误，请重试！');
            }
        });

        // 回车键提交
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
